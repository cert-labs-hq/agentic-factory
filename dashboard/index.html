<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Factory | Operations Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; }
        .token-bar-p { background-color: #475569; } /* Prompt: Slate 600 */
        .token-bar-r { background-color: #3b82f6; } /* Reasoning: Blue 500 */
        .token-bar-o { background-color: #10b981; } /* Output: Emerald 500 */
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 950: '#020617' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <nav class="border-b border-slate-800 p-4 sticky top-0 bg-slate-950/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-tight text-white">AI FACTORY <span class="text-emerald-500 text-sm tracking-widest ml-2 uppercase">Lifecycle Status</span></h1>
            </div>
            <div id="last-updated" class="text-[10px] text-slate-500 uppercase tracking-widest">Syncing Factory Data...</div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-lg shadow-xl">
            <p class="text-slate-500 text-[10px] uppercase tracking-widest mb-4">Total Project Lifecycle Cost</p>
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-6">
                <div>
                    <h2 id="lifecycle-total" class="text-5xl font-bold text-white">0</h2>
                    <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-tighter">Aggregated Factory tokens (All Phases)</p>
                </div>
                <div class="flex space-x-6 text-[11px] font-mono">
                    <div class="flex flex-col">
                        <span class="text-slate-500 uppercase text-[9px] mb-1">Prompt</span>
                        <span id="life-p" class="text-slate-400 font-bold">0</span>
                    </div>
                    <div class="flex flex-col border-l border-slate-800 pl-6">
                        <span class="text-slate-500 uppercase text-[9px] mb-1">Reasoning</span>
                        <span id="life-r" class="text-blue-400 font-bold">0</span>
                    </div>
                    <div class="flex flex-col border-l border-slate-800 pl-6">
                        <span class="text-slate-500 uppercase text-[9px] mb-1">Output</span>
                        <span id="life-o" class="text-emerald-400 font-bold">0</span>
                    </div>
                </div>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden flex">
                <div id="bar-life-p" class="token-bar-p h-full"></div>
                <div id="bar-life-r" class="token-bar-r h-full"></div>
                <div id="bar-life-o" class="token-bar-o h-full"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg flex justify-between items-center">
                <p class="text-slate-500 text-[10px] uppercase tracking-widest">Active Slices</p>
                <h2 id="count-slices" class="text-3xl font-bold text-white">0</h2>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg flex justify-between items-center">
                <p class="text-slate-500 text-[10px] uppercase tracking-widest">Code Related Tokens (Current Registry)</p>
                <h2 id="count-tokens" class="text-3xl font-bold text-emerald-500">0</h2>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden shadow-2xl">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-slate-950 text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-800">
                        <th class="px-6 py-4">ID</th>
                        <th class="px-6 py-4">Module Name</th>
                        <th class="px-6 py-4 text-center">Status</th>
                        <th class="px-6 py-4 text-right">Implementation Split (P/R/O)</th>
                    </tr>
                </thead>
                <tbody id="registry-table-body" class="divide-y divide-slate-800">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        const format = (n) => n ? n.toLocaleString() : '0';

        function renderMetrics(meta) {
            document.getElementById('count-slices').innerText = meta.total_slices;
            document.getElementById('count-tokens').innerText = format(meta.global_finops.total_combined_tokens);
            document.getElementById('last-updated').innerText = `Last Sync: ${new Date(meta.generated_at).toLocaleTimeString()}`;
            
            // Project Cost at top
            const life = meta.global_finops.project_total_cost;
            document.getElementById('lifecycle-total').innerText = format(life.total);
            document.getElementById('life-p').innerText = format(life.prompt);
            document.getElementById('life-r').innerText = format(life.reasoning);
            document.getElementById('life-o').innerText = format(life.output);

            const pPerc = (life.prompt / life.total * 100).toFixed(1);
            const rPerc = (life.reasoning / life.total * 100).toFixed(1);
            const oPerc = (life.output / life.total * 100).toFixed(1);
            document.getElementById('bar-life-p').style.width = pPerc + '%';
            document.getElementById('bar-life-r').style.width = rPerc + '%';
            document.getElementById('bar-life-o').style.width = oPerc + '%';
        }

        function renderTable(slices) {
            const container = document.getElementById('registry-table-body');
            container.innerHTML = slices.map(s => {
                const u = s.token_usage || s.forecast?.estimated_tokens || { prompt: 0, reasoning: 0, output: 0 };
                const total = u.total || (u.prompt + u.reasoning + u.output);
                const pPerc = (u.prompt / total * 100) || 0;
                const rPerc = (u.reasoning / total * 100) || 0;
                const oPerc = (u.output / total * 100) || 0;

                // Color mapping for Status
                let statusColor = 'text-slate-400 border-slate-700 bg-slate-800';
                if(s.status === 'Approved') statusColor = 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10';
                if(s.status === 'In Review') statusColor = 'text-blue-400 border-blue-500/30 bg-blue-500/10';

                return `
                    <tr class="hover:bg-slate-800/40 transition-all group">
                        <td class="px-6 py-4 font-bold text-white text-xs">
                            <a href="../${s.spec_path}" class="hover:text-emerald-400 decoration-emerald-500/40 underline underline-offset-4">${s.id}</a>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-slate-300 text-xs font-bold">${s.title}</div>
                            <div class="text-[9px] text-slate-500 uppercase mt-0.5">${s.phase}</div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2 py-0.5 rounded text-[9px] border uppercase font-bold ${statusColor}">${s.status}</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col items-end space-y-1.5">
                                <div class="flex space-x-3 text-[10px] font-mono leading-none">
                                    <span class="text-slate-400">${format(u.prompt)}</span>
                                    <span class="text-blue-400">${format(u.reasoning)}</span>
                                    <span class="text-emerald-400">${format(u.output)}</span>
                                </div>
                                <div class="w-32 bg-slate-800 h-1.5 rounded-full overflow-hidden flex">
                                    <div style="width: ${pPerc}%" class="token-bar-p"></div>
                                    <div style="width: ${rPerc}%" class="token-bar-r"></div>
                                    <div style="width: ${oPerc}%" class="token-bar-o"></div>
                                </div>
                                <span class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter">Total: ${format(total)}</span>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function init() {
            try {
                const res = await fetch('../.factory/index.json');
                const data = await res.json();
                renderMetrics(data.metadata);
                renderTable(data.slices);
            } catch (e) {
                console.error('Factory Connection Error:', e);
                document.getElementById('registry-table-body').innerHTML = `
                    <tr><td colspan="4" class="px-6 py-12 text-center text-red-500 font-bold uppercase text-[10px] tracking-widest">
                        Uplink Failure: .factory/index.json not detected
                    </td></tr>`;
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
